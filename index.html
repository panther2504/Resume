<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Studio</title>
  <meta name="description" content="Build a professional A4 resume from templates or design one from scratch with drag and drop.">
  <script>
    /* apply the saved (or system) theme before first paint to avoid a flash */
    (function () {
      var t = null;
      try { t = localStorage.getItem('resume-studio:theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Roboto+Mono:wght@400;500;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/templates.css">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/editor-pro.css">
  <link rel="stylesheet" href="css/canvas-pro.css">
  <link rel="stylesheet" href="css/insights.css">
  <link rel="stylesheet" href="css/documents.css">
</head>
<body data-mode="template">
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topbar glass">
    <div class="brand">
      <div class="logo" role="button" tabindex="0" title="My resumes (Ctrl+O)" aria-label="My resumes">R</div>
      <div class="brand-txt">
        <b>Resume Studio</b>
        <div class="doc-line">
          <button type="button" class="doc-btn" id="docBtn" aria-haspopup="dialog" title="My resumes (Ctrl+O)">
            <span class="doc-name" id="docName">&nbsp;</span>
            <svg class="ico doc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <span class="save-state" id="saveState" data-state="saving" role="status" aria-live="polite" title="Loading your resume…">
            <svg class="ico ss-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            <svg class="ico ss-busy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>
            <svg class="ico ss-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span class="save-txt">Loading…</span>
          </span>
        </div>
      </div>
    </div>

    <nav class="mode-switch" id="modeSwitch" data-active="template" aria-label="Editor mode">
      <span class="mode-pill"></span>
      <button type="button" data-mode="template" class="active">Templates &amp; Content</button>
      <button type="button" data-mode="canvas">Canvas Designer</button>
    </nav>

    <div class="top-actions">
      <button type="button" class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Light mode" title="Switch light / dark mode">
        <span class="ts-knob"></span>
        <span class="ts-ico ts-moon"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        <span class="ts-ico ts-sun"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>
      </button>
      <button type="button" class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button type="button" class="icon-btn" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="zoomOut" title="Zoom out">−</button>
        <span id="zoomVal">80%</span>
        <button type="button" id="zoomIn" title="Zoom in">+</button>
        <button type="button" id="zoomFit" class="fit" title="Fit to width">Fit</button>
      </div>
      <div class="dropdown">
        <button type="button" class="btn ghost" id="fileMenuBtn">File
          <svg class="ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="menu glass file-menu" id="fileMenu">
          <button type="button" data-act="docs">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>My resumes…</span><kbd>Ctrl O</kbd>
          </button>
          <hr>
          <button type="button" data-act="blank">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="12" x2="12" y2="18"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
            <span>New blank resume</span>
          </button>
          <button type="button" data-act="sample">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
            <span>New from sample</span>
          </button>
          <button type="button" data-act="duplicate">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Duplicate this resume</span>
          </button>
          <hr>
          <button type="button" data-act="import">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Import JSON…</span>
          </button>
          <button type="button" data-act="export">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export JSON</span>
          </button>
        </div>
      </div>
      <div class="dropdown">
        <button type="button" class="btn primary" id="downloadBtn" aria-haspopup="true">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Download</span>
          <svg class="ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="menu glass dl-menu" id="downloadMenu">
          <button type="button" data-dl="pdf"><span class="dl-badge pdf">PDF</span><span><b>PDF file</b><small>A4 pages, exactly as designed</small></span></button>
          <button type="button" data-dl="png"><span class="dl-badge png">PNG</span><span><b>PNG image</b><small>High-res pages (2×), .zip if several</small></span></button>
          <button type="button" data-dl="excel"><span class="dl-badge xls">XLS</span><span><b>Excel workbook</b><small>Resume data in sheets (.xlsx)</small></span></button>
          <button type="button" data-dl="txt"><span class="dl-badge txt">TXT</span><span><b>Plain text (.txt)</b><small>ATS-friendly text for job portals</small></span></button>
          <hr>
          <button type="button" data-dl="print"><span class="dl-badge prt">⎙</span><span><b>Print / Save as PDF</b><small>Browser print dialog, vector text</small></span></button>
          <button type="button" data-dl="json"><span class="dl-badge json">{ }</span><span><b>JSON backup</b><small>Re-import later to keep editing</small></span></button>
        </div>
      </div>
    </div>
  </header>

  <main class="workspace">
    <!-- ============ Template mode ============ -->
    <section class="mode mode-template active" id="modeTemplate">
      <aside class="panel glass left-panel">
        <div class="tabs" id="tplTabs" role="tablist">
          <button type="button" data-tab="templates">Templates</button>
          <button type="button" data-tab="content" class="active">Content</button>
          <button type="button" data-tab="design">Design</button>
          <button type="button" data-tab="insights">Insights</button>
        </div>
        <div class="panel-scroll">
          <div class="tab-body" data-tab-body="templates">
            <p class="hint">Pick a template. Your content stays the same, so switch as often as you like.</p>
            <div class="tpl-grid" id="tplGrid"></div>
          </div>
          <div class="tab-body active" data-tab-body="content">
            <div id="contentForms"></div>
          </div>
          <div class="tab-body" data-tab-body="design">
            <div id="designForms"></div>
          </div>
          <div class="tab-body" data-tab-body="insights">
            <div id="insightsPanel"></div>
          </div>
        </div>
      </aside>

      <div class="stage" id="tplStage">
        <div class="stage-bar glass">
          <span id="pageInfo">A4 · 1 page</span>
          <span class="sep"></span>
          <button type="button" class="link" id="toCanvasBtn" title="Convert this resume into freely editable canvas elements">Customize freely in Canvas →</button>
        </div>
        <div class="pages" id="tplPages"></div>
      </div>
    </section>

    <!-- ============ Canvas mode ============ -->
    <section class="mode mode-canvas" id="modeCanvas">
      <aside class="panel glass left-panel">
        <div class="panel-scroll">
          <div class="pgroup">
            <div class="pgroup-title">Start from</div>
            <div class="start-grid">
              <button type="button" class="start-btn" id="cvFromTpl"><b>My template</b><small>Convert the current resume</small></button>
              <button type="button" class="start-btn" id="cvStarter"><b>Starter layout</b><small>Sidebar design</small></button>
              <button type="button" class="start-btn" id="cvBlank"><b>Blank page</b><small>Your own creation</small></button>
            </div>
          </div>
          <div class="pgroup">
            <div class="pgroup-title">Elements <small>drag onto a page</small></div>
            <div class="palette" id="palette"></div>
          </div>
          <div class="pgroup">
            <button type="button" class="btn block" id="cvAddPage">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>Add A4 page</span>
            </button>
            <p class="hint">Tip: drop image files from your computer straight onto a page.</p>
          </div>
        </div>
      </aside>

      <div class="stage" id="cvStage">
        <div class="pages" id="cvPages"></div>
      </div>

      <aside class="panel glass right-panel" id="propsPanel"></aside>
    </section>
  </main>

  <div id="measureHost" class="pages" aria-hidden="true"></div>
  <div id="exportHost" class="pages" aria-hidden="true"></div>
  <input type="file" id="importInput" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/export.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
